# examples/basic/i18n/locales/pl/emails.yaml

welcome:
  subject:
    value: "Witamy w {product}"
    placeholders:
      product: {type: string}
  body:
    value: "Cześć {name}, Twoje konto jest gotowe."
    placeholders:
      name: {type: string}
digest:
  subject:
    plural:
      argument: count
      forms:
        one: "1 nowa wiadomość"
        few: "{count} nowe wiadomości"
        many: "{count} nowych wiadomości"
        other: "{count} nowej wiadomości"
    description: "Digest subject line. Counted, and rendered by Go."
    placeholders:
      count: {type: integer}
